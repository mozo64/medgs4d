[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medgs4d"
version = "0.1.0"
description = "Phase-conditioned MedGS for respiratory 4D-CT reconstruction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "pydicom>=2.4",
  "Pillow>=10",
  "matplotlib>=3.8",
  "ipywidgets>=8",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["medgs4d*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "worf: integration tests that require the MedGS CUDA environment and real run data",
]
